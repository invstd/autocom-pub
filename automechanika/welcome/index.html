    <script>
      (function() {
        // Usability-test / demo links can carry presets as URL params (?theme=&language=&mode=),
        // generated from Launchpad 2 Settings. Seed localStorage from them before first paint —
        // same place base.njk already reads 'theme' from — then strip just those keys from the
        // URL (preserving any other params, e.g. diagnostics-dashboard's vehicle data) so a
        // bookmarked/reloaded link doesn't keep re-forcing presets after the tester's own
        // in-session changes.
        var params = new URLSearchParams(location.search);
        var PRESET_PARAM_TO_STORAGE_KEY = { theme: 'theme', language: 'language', mode: 'launchpad-onboarding-mode', notif: 'launchpad-notifications-suppressed', vehicleType: 'automechanika-vehicle-type', role: 'automechanika-role' };
        var paramsChanged = false;
        Object.keys(PRESET_PARAM_TO_STORAGE_KEY).forEach(function (param) {
          if (params.has(param)) {
            var value = params.get(param);
            // Automechanika's Settings Test Link now generates brand-only theme values ("WOW",
            // not "WOW Dark" — light/dark is the sidebar footer's own toggle, not part of the
            // preset link, see automechanika-theme-toggle.js) — resolve those against whichever
            // mode was last selected on this device, defaulting to Dark if none has been yet.
            // Full theme names ("Hi-Tech", "WOW Dark", …) pass through unchanged.
            if (param === 'theme' && /^(Autocom|WOW|Wabco)$/.test(value)) {
              value = value + ' ' + (localStorage.getItem('theme-mode') || 'Dark');
            }
            localStorage.setItem(PRESET_PARAM_TO_STORAGE_KEY[param], value);
            params.delete(param);
            paramsChanged = true;
          }
        });
        // ?gate=1 bypasses the prototype password gate (sessionStorage, same key/value the gate
        // itself writes on a correct password) — runs before the next script block below reads
        // it, so the gate never flashes. Not real security either way, see prototype-gate.js.
        if (params.get('gate') === '1') {
          try { sessionStorage.setItem('autocom-prototype-gate', '1'); } catch (e) {}
          params.delete('gate');
          paramsChanged = true;
        }
        if (paramsChanged) {
          var newSearch = params.toString();
          history.replaceState(null, '', location.pathname + (newSearch ? '?' + newSearch : '') + location.hash);
        }
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'Hi-Tech');
        // Role (Admin/User) — for sharing a link with trusted external users while hiding
        // internal-only Settings sections (data-admin-only, see main.css). Client-side only, same
        // "not real security" caveat as the password gate (prototype-gate.js) — fine for hiding
        // UI from a trusted-audience demo link, not an access-control boundary. Defaults to Admin
        // (today's full-access behavior) so any link without ?role= is unaffected.
        document.documentElement.setAttribute('data-role', localStorage.getItem('automechanika-role') || 'Admin');
      })();
    </script>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('autocom-prototype-gate') === '1') {
            document.documentElement.classList.add('prototype-gate-unlocked');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var el = document.getElementById('automechanika-offline-status');
        var alertEl = document.getElementById('automechanika-offline-status-alert');
        var textEl = document.getElementById('automechanika-offline-status-text');
        var spinnerEl = document.getElementById('automechanika-offline-status-spinner');
        var successIconEl = document.getElementById('automechanika-offline-status-success-icon');
        var errorIconEl = document.getElementById('automechanika-offline-status-error-icon');

        function setState(state, message) {
          el.classList.remove('hidden');
          textEl.textContent = message;
          spinnerEl.classList.toggle('hidden', state !== 'pending');
          successIconEl.classList.toggle('hidden', state !== 'ready');
          errorIconEl.classList.toggle('hidden', state !== 'error');
          alertEl.classList.remove('alert-info', 'alert-success', 'alert-error');
          alertEl.classList.add(state === 'pending' ? 'alert-info' : state === 'ready' ? 'alert-success' : 'alert-error');
        }

        function autoHide(delay) {
          setTimeout(function () { el.classList.add('hidden'); }, delay);
        }

        function watchWorker(worker) {
          if (!worker) return;
          worker.addEventListener('statechange', function () {
            if (worker.state === 'activated') {
              setState('ready', 'Ready for offline use');
              autoHide(4000);
            } else if (worker.state === 'redundant') {
              setState('error', 'Offline setup failed — reload while connected to try again');
            }
          });
        }

        window.addEventListener('load', function () {
          // 'updatefound' fires for every fresh registration too, not just later updates, so
          // capture whether this is a first-ever install *before* that listener can run — it
          // decides which message the (harmless, redundant on first install) updatefound handler
          // below should show.
          var isFirstInstall = !navigator.serviceWorker.controller;
          navigator.serviceWorker.register('/diagnostics-pub/automechanika/service-worker.js', { scope: '/diagnostics-pub/automechanika/' }).then(function (reg) {
            if (reg.installing) {
              setState('pending', 'Preparing offline mode…');
              watchWorker(reg.installing);
            } else if (reg.waiting) {
              watchWorker(reg.waiting);
            }
            // else: already active with nothing new installing — offline mode is already set up
            // from a previous visit, so stay silent rather than re-announcing "ready" on every
            // single page load.
            reg.addEventListener('updatefound', function () {
              if (isFirstInstall) return; // already handled by the reg.installing branch above
              setState('pending', 'Updating offline files…');
              watchWorker(reg.installing);
            });
          }).catch(function () {
            setState('error', 'Offline setup failed — reload while connected to try again');
          });
        });
      })();
    </script>
