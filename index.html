<!DOCTYPE html>
<html lang="en" data-theme="Hi-Tech">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autocom Prototypes - Autocom Prototypes</title>
    <script>
      (function() {
        // Usability-test / demo links can carry presets as URL params (?theme=&language=&mode=),
        // generated from Launchpad 2 Settings. Seed localStorage from them before first paint —
        // same place base.njk already reads 'theme' from — then strip just those keys from the
        // URL (preserving any other params, e.g. diagnostics-dashboard's vehicle data) so a
        // bookmarked/reloaded link doesn't keep re-forcing presets after the tester's own
        // in-session changes.
        var params = new URLSearchParams(location.search);
        var PRESET_PARAM_TO_STORAGE_KEY = { theme: 'theme', language: 'language', mode: 'launchpad-onboarding-mode', notif: 'launchpad-notifications-suppressed', vehicleType: 'automechanika-vehicle-type', role: 'automechanika-role' };
        var paramsChanged = false;
        Object.keys(PRESET_PARAM_TO_STORAGE_KEY).forEach(function (param) {
          if (params.has(param)) {
            var value = params.get(param);
            // Automechanika's Settings Test Link now generates brand-only theme values ("WOW",
            // not "WOW Dark" — light/dark is the sidebar footer's own toggle, not part of the
            // preset link, see automechanika-theme-toggle.js) — resolve those against whichever
            // mode was last selected on this device, defaulting to Dark if none has been yet.
            // Full theme names ("Hi-Tech", "WOW Dark", …) pass through unchanged.
            if (param === 'theme' && /^(Autocom|WOW|Wabco)$/.test(value)) {
              value = value + ' ' + (localStorage.getItem('theme-mode') || 'Dark');
            }
            localStorage.setItem(PRESET_PARAM_TO_STORAGE_KEY[param], value);
            params.delete(param);
            paramsChanged = true;
          }
        });
        // ?gate=1 bypasses the prototype password gate (sessionStorage, same key/value the gate
        // itself writes on a correct password) — runs before the next script block below reads
        // it, so the gate never flashes. Not real security either way, see prototype-gate.js.
        if (params.get('gate') === '1') {
          try { sessionStorage.setItem('autocom-prototype-gate', '1'); } catch (e) {}
          params.delete('gate');
          paramsChanged = true;
        }
        if (paramsChanged) {
          var newSearch = params.toString();
          history.replaceState(null, '', location.pathname + (newSearch ? '?' + newSearch : '') + location.hash);
        }
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'Hi-Tech');
        // Role (Admin/User) — for sharing a link with trusted external users while hiding
        // internal-only Settings sections (data-admin-only, see main.css). Client-side only, same
        // "not real security" caveat as the password gate (prototype-gate.js) — fine for hiding
        // UI from a trusted-audience demo link, not an access-control boundary. Defaults to Admin
        // (today's full-access behavior) so any link without ?role= is unaffected.
        document.documentElement.setAttribute('data-role', localStorage.getItem('automechanika-role') || 'Admin');
      })();
    </script>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('autocom-prototype-gate') === '1') {
            document.documentElement.classList.add('prototype-gate-unlocked');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/autocom-pub/assets/styles/main.css">

</head>
<body class="bg-base-100 text-base-content">

    
<div class="min-h-screen flex flex-col">
    <nav class="site-nav navbar bg-base-100 shadow-lg">
    <div class="flex-1">
        <a class="btn btn-ghost text-xl" href="/autocom-pub/">Autocom</a>
    </div>
    <div class="flex-none">
        <ul class="menu menu-horizontal px-1">
            <li><a href="/autocom-pub/">Home</a></li>
            <li>
                <details id="theme-dropdown">
                    <summary>Theme</summary>
                    <ul class="bg-base-100 rounded-t-none p-2 z-50">
                        <li><a href="#" onclick="event.preventDefault(); document.documentElement.setAttribute('data-theme', 'Autocom Dark'); localStorage.setItem('theme', 'Autocom Dark'); document.getElementById('theme-dropdown').removeAttribute('open'); return false;">Autocom Dark</a></li>
                        <li><a href="#" onclick="event.preventDefault(); document.documentElement.setAttribute('data-theme', 'Hi-Tech'); localStorage.setItem('theme', 'Hi-Tech'); document.getElementById('theme-dropdown').removeAttribute('open'); return false;">Hi-Tech</a></li>
                    </ul>
                </details>
            </li>
        </ul>
    </div>
</nav>


    <main class="flex-1 flex flex-col min-h-0 container mx-auto px-4 py-8">
        <div class="hero flex-1 flex min-h-0 items-center justify-center">
            <div class="hero-content text-center w-full max-w-full">
            <div class="max-w-md mx-auto">
                <h1 class="mb-5 text-5xl font-bold">Autocom</h1>
                <p class="mb-5">Thanks for taking part. When you're ready to begin, click below to start the session.</p>

                <div class="grid gap-4">
                    <a href="/autocom-pub/splash/?redirect=launchpad-2/install/" class="btn btn-primary btn-lg">
                        Start
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>

    
<div id="prototype-gate-root" class="prototype-gate-root fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" aria-modal="true" role="dialog" aria-labelledby="prototype-gate-title" aria-describedby="prototype-gate-desc">
  <div class="card bg-base-100 border border-base-300 shadow-xl w-full max-w-xs sm:max-w-sm">
    <div class="card-body p-6 sm:p-8">
      <h2 id="prototype-gate-title" class="card-title text-xl mb-3">Prototype access</h2>
      <p id="prototype-gate-desc" class="text-sm text-base-content/80 leading-relaxed mb-8">This build is password-protected. Enter the password to continue.</p>
      <div class="flex flex-col gap-8">
        <label class="floating-label w-full">
          <input type="password" id="prototype-gate-input" class="input input-bordered w-full" placeholder="Password" autocomplete="current-password" />
          <span>Password</span>
        </label>
        <div class="flex flex-col gap-3">
          <p id="prototype-gate-error" class="text-sm text-error leading-snug hidden min-h-0" role="alert">Incorrect password. Try again.</p>
          <button type="button" id="prototype-gate-submit" class="btn btn-primary btn-block">Continue</button>
        </div>
      </div>
      <noscript><p class="text-sm text-warning mt-6">JavaScript is required to unlock this prototype.</p></noscript>
    </div>
  </div>
</div>

    <script src="/autocom-pub/assets/scripts/prototype-gate.js"></script>
</body>
</html>
